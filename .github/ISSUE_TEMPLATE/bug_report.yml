name: Bug report
description: Report a reproducible defect in one of the packages
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not submit secrets or security vulnerabilities here. Follow packages/router/SECURITY.md for private reporting.
  - type: dropdown
    id: package
    attributes:
      label: Package
      options: [host, router, connectors, environment]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version or commit
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Observed behavior
      description: Include a minimal reproduction using synthetic data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification details
      description: Relevant tests, protocol versions, and sanitized logs.
