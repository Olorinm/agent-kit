name: CI environment
on:
  push:
    branches: [main]
    paths: [packages/environment/**, .github/workflows/ci-environment.yml]
  pull_request:
    paths: [packages/environment/**, .github/workflows/ci-environment.yml]
permissions:
  contents: read
defaults:
  run:
    working-directory: packages/environment
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/environment/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:package
      - run: npm ci --prefix cloudflare
      - run: npm run check --prefix cloudflare
      - run: npm test --prefix cloudflare
      - run: node --test cloudflare/backup/test/*.test.mjs
      - uses: actions/checkout@v4
        with:
          repository: BroZhong/open-managed-agents
          ref: e04695152219a91c2ecdff41955dfc3fab73b438
          path: packages/environment/state/oma-reference
      - run: npm run check:upstream -- state/oma-reference
