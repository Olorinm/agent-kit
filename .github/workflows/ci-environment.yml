name: CI environment
on:
  push:
    branches: [main]
    paths: [packages/environment/**, .github/workflows/ci-environment.yml]
  pull_request:
    paths: [packages/environment/**, .github/workflows/ci-environment.yml]
permissions:
  contents: read
concurrency:
  group: ci-environment-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: packages/environment
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.22.2
          cache: npm
          cache-dependency-path: packages/environment/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:package
      - run: npm ci --prefix cloudflare
      - run: npm run check --prefix cloudflare
      - run: npm test --prefix cloudflare
      - run: node --test cloudflare/backup/test/*.test.mjs
