name: CI router

on:
  push:
    branches: [main]
    paths: [packages/router/**, .github/workflows/ci-router.yml]
  pull_request:
    paths: [packages/router/**, .github/workflows/ci-router.yml]

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/router

concurrency:
  group: ci-router-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.22.2
          cache: npm
          cache-dependency-path: packages/router/package-lock.json
      - run: npm install --global npm@11.19.1 --no-audit --no-fund
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install the packed archive and load its entry point
        run: |
          archive=$(npm pack --silent)
          npm install --prefix "$RUNNER_TEMP/agent-router" "./$archive" --ignore-scripts --no-audit --no-fund
          (cd "$RUNNER_TEMP/agent-router" && node --input-type=module -e 'const router = await import("@agent-router/server"); if (typeof router.createRouter !== "function") process.exit(1)')
