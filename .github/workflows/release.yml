name: Release

# Push a tag v<version> to build every package at that commit and publish one GitHub
# Release with all archives. Run it manually to build and pack without publishing.
# Tests run in the CI workflows; tag a commit whose checks have passed.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Archive bytes depend on these versions.
  NODE_VERSION: 24.22.2
  NPM_VERSION: 11.19.1

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --global "npm@$NPM_VERSION" --no-audit --no-fund

      - name: Check versions and release notes
        id: meta
        run: |
          set -eu
          version=$(node -p 'require("./packages/host/package.json").version')
          for package in host router connectors environment; do
            found=$(node -p "require('./packages/$package/package.json').version")
            [ "$found" = "$version" ] || { echo "packages/$package is $found, packages/host is $version" >&2; exit 1; }
          done
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2; exit 1
          fi
          awk -v heading="## [$version]" 'index($0, heading) == 1 { found = 1; next } found && /^## / { exit } found { print }' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" || { echo "CHANGELOG.md has no section for $version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and pack
        run: |
          set -eu
          out="$RUNNER_TEMP/release"
          mkdir -p "$out"
          (cd packages/host && npm ci --ignore-scripts && npm pack --pack-destination "$out")
          (cd packages/connectors && npm ci && npm pack --pack-destination "$out")
          (cd packages/environment && npm ci && npm pack --pack-destination "$out")
          (cd packages/router && npm ci && npm pack --pack-destination "$out")
          (cd "$out" && sha256sum ./*.tgz > SHA256SUMS && cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY")

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-kit-${{ steps.meta.outputs.version }}
          path: ${{ runner.temp }}/release
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        working-directory: ${{ runner.temp }}/release
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Agent Kit ${{ steps.meta.outputs.version }}
        run: gh release create "$GITHUB_REF_NAME" ./* --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag ${{ contains(steps.meta.outputs.version, '-') && '--prerelease' || '' }}
