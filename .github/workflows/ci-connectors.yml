name: CI connectors
on:
  push:
    branches: [main]
    paths: [packages/connectors/**, .github/workflows/ci-connectors.yml]
  pull_request:
    paths: [packages/connectors/**, .github/workflows/ci-connectors.yml]
permissions:
  contents: read
concurrency:
  group: ci-connectors-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: packages/connectors
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.2
          cache: npm
          cache-dependency-path: packages/connectors/package-lock.json
      - run: npm ci
      - run: npm test
        timeout-minutes: 3
      - run: npm ci --prefix cloudflare
      - run: npm run check --prefix cloudflare
      - run: npm test --prefix cloudflare
