name: CI host
on:
  push:
    branches: [main]
    paths: [packages/host/**, .github/workflows/ci-host.yml]
  pull_request:
    paths: [packages/host/**, .github/workflows/ci-host.yml]
permissions:
  contents: read
concurrency:
  group: ci-host-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: packages/host
jobs:
  package:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.2
          cache: npm
          cache-dependency-path: packages/host/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
        timeout-minutes: 3
      - run: npm run test:package
        # Fresh Windows consumers can spend several minutes installing native SDK dependencies.
        timeout-minutes: ${{ runner.os == 'Windows' && 10 || 5 }}
