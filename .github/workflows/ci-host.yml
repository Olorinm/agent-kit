name: CI host
on:
  push:
    branches: [main]
    paths: [packages/host/**, .github/workflows/ci-host.yml]
  pull_request:
    paths: [packages/host/**, .github/workflows/ci-host.yml]
concurrency:
  group: ci-host-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: packages/host
jobs:
  package:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/host/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
        timeout-minutes: 3
      - run: npm run test:package
        # Fresh Windows consumers can spend several minutes installing native SDK dependencies.
        timeout-minutes: ${{ runner.os == 'Windows' && 10 || 5 }}
